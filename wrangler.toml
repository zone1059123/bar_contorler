name = "barkeep"
main = "dist/server/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
REQUIRE_BAR_PASSWORD = "true"

[[d1_databases]]
binding = "DB"
database_name = "barkeep"
database_id = "b84b43ba-02be-4fe2-8cbf-02e2c908411c"
migrations_dir = "migrations"
